<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f6f4; color: #23332d; }
        .page-title { color: #194b39; }
        .grid-heading { color: #52665c; background: #e8efeb; font-size: .78rem; font-weight: 700; }
        .data-row { background: #fff; }
    </style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <header class="row align-items-center g-3 pb-4 mb-3 border-bottom">
        <div class="col-12 col-md">
            <h1 class="page-title h2 mb-1">Pedidos</h1>
            <p class="text-secondary mb-0">Gestión de pedidos</p>
        </div>
        <nav class="col-12 col-md-auto d-flex flex-wrap gap-2" aria-label="Navegación principal">
            <a class="btn btn-outline-success" th:href="@{/clientes}">Clientes</a>
            <a class="btn btn-outline-success" th:href="@{/comerciales}">Comerciales</a>
            <a class="btn btn-success" th:href="@{/pedidos/crear}">Crear pedido</a>
        </nav>
    </header>

    <div class="row g-2 rounded-top px-3 py-2 grid-heading d-none d-lg-flex" aria-hidden="true">
        <div class="col-lg-1">Id</div><div class="col-lg-2">Total</div>
        <div class="col-lg-2">Fecha</div><div class="col-lg-2">Cliente</div>
        <div class="col-lg-2">Comercial</div><div class="col-lg-3">Acciones</div>
    </div>
    <div th:if="${#lists.isEmpty(Pedidos)}" class="bg-white p-4 text-secondary">No hay pedidos registrados.</div>
    <div th:each="pedido : ${Pedidos}" class="row g-2 align-items-center px-3 py-3 border-bottom data-row">
        <div class="col-6 col-lg-1"><span class="d-lg-none small text-secondary">Id<br></span><span th:text="${pedido.id}">1</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Total<br></span><span th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">150.50</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Fecha<br></span><span th:text="${pedido.fecha ?: '-'}">2017-10-05</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Cliente<br></span><span th:text="${pedido.clienteNombre}">Marcos Loyola Méndez</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Comercial<br></span><span th:text="${pedido.comercialNombre}">Juan Gómez López</span></div>
        <div class="col-12 col-lg-3 d-flex flex-wrap gap-1">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
            <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
