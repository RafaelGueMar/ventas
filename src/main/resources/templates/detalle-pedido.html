<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de pedido | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .page-title { color: #194b39; }</style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <header class="row align-items-center g-3 pb-3 mb-3 border-bottom">
        <h1 class="page-title h2 col mb-0">Detalle de pedido</h1>
        <div class="col-auto d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver</a>
            <a class="btn btn-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
        </div>
    </header>
    <dl class="row g-0 bg-white rounded">
        <dt class="col-5 col-md-3 p-3 border-bottom">Id</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${pedido.id}">1</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Total</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">150.50</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Fecha</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${pedido.fecha ?: '-'}">2017-10-05</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Cliente</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${pedido.clienteNombre}">Marcos Loyola Méndez</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Comercial</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${pedido.comercialNombre}">Juan Gómez López</dd>
    </dl>
</main>
</body>
</html>
