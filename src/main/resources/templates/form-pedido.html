<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Ventas'">Pedido | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .page-title { color: #194b39; }</style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <form class="row g-3" th:action="@{${formAction}}" th:object="${pedido}" method="post">
        <header class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-3 pb-3 border-bottom">
            <h1 class="page-title h2 mb-0" th:text="${titulo}">Pedido</h1>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a>
                <button class="btn btn-success" type="submit">Guardar</button>
            </div>
        </header>
        <div th:if="${error}" class="col-12 alert alert-danger" role="alert" th:text="${error}"></div>
        <input th:if="${pedido.id != 0}" type="hidden" th:field="*{id}">
        <div class="col-12 col-md-6">
            <label class="form-label" for="total">Total</label>
            <input class="form-control" id="total" type="number" step="0.01" min="0" th:field="*{total}" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-control" id="fecha" type="date" th:field="*{fecha}">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="clienteId">Cliente</label>
            <select class="form-select" id="clienteId" th:field="*{clienteId}" required>
                <option value="">Selecciona un cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}">
                    Cliente
                </option>
            </select>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="comercialId">Comercial</label>
            <select class="form-select" id="comercialId" th:field="*{comercialId}" required>
                <option value="">Selecciona un comercial</option>
                <option th:each="comercial : ${comerciales}"
                        th:value="${comercial.id}"
                        th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">
                    Comercial
                </option>
            </select>
        </div>
    </form>
</main>
</body>
</html>
