<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Ventas'">Cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .page-title { color: #194b39; }</style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <form class="row g-3" th:action="@{${formAction}}" th:object="${cliente}" method="post">
        <header class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-3 pb-3 border-bottom">
            <h1 class="page-title h2 mb-0" th:text="${titulo}">Cliente</h1>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                <button class="btn btn-success" type="submit">Guardar</button>
            </div>
        </header>
        <input th:if="${cliente.id != 0}" type="hidden" th:field="*{id}">
        <div class="col-12 col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" maxlength="100" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="apellido1">Primer apellido</label>
            <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" maxlength="100" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="apellido2">Segundo apellido</label>
            <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="ciudad">Ciudad</label>
            <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}" maxlength="100">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="categoria">Categoría</label>
            <input class="form-control" id="categoria" type="number" min="0" th:field="*{categoria}">
        </div>
    </form>

    <div th:if="${cliente.id != 0}" class="mt-5">
        <div th:if="${mensaje}" class="alert" th:classappend="' alert-' + tipoMensaje" role="alert"
             th:text="${mensaje}"></div>
        <section class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 page-title">Añadir comercial</h2>
                <form class="row g-3" th:action="@{/clientes/editar/{id}/comerciales(id=${cliente.id})}" method="post">
                    <div class="col-12 col-md-5">
                        <label class="form-label" for="comercialId">Comercial</label>
                        <select class="form-select" id="comercialId" name="comercialId" required>
                            <option value="">Selecciona un comercial</option>
                            <option th:each="comercial : ${comercialesDisponibles}"
                                    th:value="${comercial.id}"
                                    th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">
                            </option>
                        </select>
                        <div th:if="${#lists.isEmpty(comercialesDisponibles)}" class="form-text">
                            Todos los comerciales ya están vinculados.
                        </div>
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label" for="fecha">Fecha</label>
                        <input class="form-control" id="fecha" name="fecha" type="date" required>
                    </div>
                    <div class="col-12 col-md-2">
                        <label class="form-label" for="prioridad">Prioridad</label>
                        <input class="form-control" id="prioridad" name="prioridad" type="number" min="1" required>
                    </div>
                    <div class="col-12 col-md-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit"
                                th:disabled="${#lists.isEmpty(comercialesDisponibles)}">Añadir Comercial</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="mt-4">
            <h2 class="h4 page-title">Comerciales vinculados</h2>
            <div th:if="${#lists.isEmpty(comercialesVinculados)}" class="bg-white p-3 text-secondary">
                No hay comerciales vinculados a este cliente.
            </div>
            <div th:each="vinculo : ${comercialesVinculados}"
                 class="row g-2 align-items-center bg-white border-bottom px-3 py-3">
                <div class="col-12 col-md-4"
                     th:text="${vinculo.comercial.nombre + ' ' + vinculo.comercial.apellido1}">Comercial</div>
                <div class="col-6 col-md-2">
                    <span class="small text-secondary d-md-none">Fecha<br></span>
                    <span th:text="${vinculo.fecha}">2026-01-01</span>
                </div>
                <div class="col-6 col-md-2">
                    <span class="small text-secondary d-md-none">Prioridad<br></span>
                    <span th:text="${vinculo.prioridad}">1</span>
                </div>
                <div class="col-12 col-md-4 text-md-end">
                    <form th:action="@{/clientes/editar/{clienteId}/comerciales/{comercialId}/borrar(clienteId=${cliente.id}, comercialId=${vinculo.comercial.id})}"
                          method="post">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
