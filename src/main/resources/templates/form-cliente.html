<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Ventas'">Cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .page-title { color: #194b39; }</style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <form class="row g-3" th:action="@{${formAction}}" th:object="${cliente}" method="post">
        <header class="col-12 d-flex flex-wrap align-items-center justify-content-between gap-3 pb-3 border-bottom">
            <h1 class="page-title h2 mb-0" th:text="${titulo}">Cliente</h1>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                <button class="btn btn-success" type="submit">Guardar</button>
            </div>
        </header>
        <input th:if="${cliente.id != 0}" type="hidden" th:field="*{id}">
        <div class="col-12 col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" maxlength="100" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="apellido1">Primer apellido</label>
            <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" maxlength="100" required>
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="apellido2">Segundo apellido</label>
            <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="ciudad">Ciudad</label>
            <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}" maxlength="100">
        </div>
        <div class="col-12 col-md-6">
            <label class="form-label" for="categoria">Categoría</label>
            <input class="form-control" id="categoria" type="number" min="0" th:field="*{categoria}">
        </div>
    </form>
</main>
</body>
</html>
