<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f6f4; color: #23332d; }
        .page-title { color: #194b39; }
        .grid-heading { color: #52665c; background: #e8efeb; font-size: .78rem; font-weight: 700; }
        .data-row { background: #fff; }
    </style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <header class="row align-items-center g-3 pb-4 mb-3 border-bottom">
        <div class="col-12 col-md">
            <h1 class="page-title h2 mb-1">Clientes</h1>
            <p class="text-secondary mb-0">Gestión de clientes</p>
        </div>
        <nav class="col-12 col-md-auto d-flex flex-wrap gap-2" aria-label="Navegación principal">
            <a class="btn btn-outline-success" th:href="@{/comerciales}">Comerciales</a>
            <a class="btn btn-outline-success" th:href="@{/pedidos}">Pedidos</a>
            <a class="btn btn-success" th:href="@{/clientes/crear}">Crear cliente</a>
        </nav>
    </header>

    <div th:if="${mensaje}" class="alert" th:classappend="' alert-' + tipoMensaje" role="alert"
         th:text="${mensaje}"></div>

    <form class="row g-2 align-items-end mb-4" th:action="@{/clientes}" method="get">
        <div class="col-12 col-md-5 col-lg-4">
            <label class="form-label" for="ciudad">Filtrar por ciudad</label>
            <input class="form-control" id="ciudad" name="ciudad" type="text"
                   placeholder="Ej.: Madrid" th:value="${ciudadFiltro}">
        </div>
        <div class="col-auto">
            <button class="btn btn-success" type="submit">Filtrar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Limpiar</a>
        </div>
    </form>

    <div class="row g-2 rounded-top px-3 py-2 grid-heading d-none d-lg-flex" aria-hidden="true">
        <div class="col-lg-1">Id</div><div class="col-lg-2">Nombre</div>
        <div class="col-lg-2">Apellido 1</div><div class="col-lg-2">Apellido 2</div>
        <div class="col-lg-2">Ciudad</div><div class="col-lg-1">Categoría</div><div class="col-lg-2">Acciones</div>
    </div>
    <div th:if="${#lists.isEmpty(Clientes)}" class="bg-white p-4 text-secondary">No hay clientes registrados.</div>
    <div th:each="cliente : ${Clientes}" class="row g-2 align-items-center px-3 py-3 border-bottom data-row">
        <div class="col-6 col-lg-1"><span class="d-lg-none small text-secondary">Id<br></span><span th:text="${cliente.id}">1</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Nombre<br></span><span th:text="${cliente.nombre}">Nombre</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Apellido 1<br></span><span th:text="${cliente.apellido1}">Apellido</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Apellido 2<br></span><span th:text="${cliente.apellido2 ?: '-'}">-</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Ciudad<br></span><span th:text="${cliente.ciudad ?: '-'}">-</span></div>
        <div class="col-6 col-lg-1"><span class="d-lg-none small text-secondary">Categoría<br></span><span th:text="${cliente.categoria ?: '-'}">-</span></div>
        <div class="col-12 col-lg-2 d-flex flex-wrap gap-1">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}(id=${cliente.id})}">Ver</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
            <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
