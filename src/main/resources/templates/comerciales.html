<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comerciales | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f3f6f4; color: #23332d; }
        .page-title { color: #194b39; }
        .grid-heading { color: #52665c; background: #e8efeb; font-size: .78rem; font-weight: 700; }
        .data-row { background: #fff; }
    </style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <header class="row align-items-center g-3 pb-4 mb-3 border-bottom">
        <div class="col-12 col-md">
            <h1 class="page-title h2 mb-1">Comerciales</h1>
            <p class="text-secondary mb-0">Gestión de comerciales</p>
        </div>
        <nav class="col-12 col-md-auto d-flex flex-wrap gap-2" aria-label="Navegación principal">
            <a class="btn btn-outline-success" th:href="@{/clientes}">Clientes</a>
            <a class="btn btn-success" th:href="@{/comerciales/crear}">Crear comercial</a>
        </nav>
    </header>

    <div th:if="${mensaje}" class="alert" th:classappend="' alert-' + tipoMensaje" role="alert"
         th:text="${mensaje}"></div>

    <div class="row g-2 rounded-top px-3 py-2 grid-heading d-none d-lg-flex" aria-hidden="true">
        <div class="col-lg-1">Id</div><div class="col-lg-2">Nombre</div>
        <div class="col-lg-2">Apellido 1</div><div class="col-lg-2">Apellido 2</div>
        <div class="col-lg-2">Comisión</div><div class="col-lg-3">Acciones</div>
    </div>
    <div th:if="${#lists.isEmpty(Comerciales)}" class="bg-white p-4 text-secondary">No hay comerciales registrados.</div>
    <div th:each="comercial : ${Comerciales}" class="row g-2 align-items-center px-3 py-3 border-bottom data-row">
        <div class="col-6 col-lg-1"><span class="d-lg-none small text-secondary">Id<br></span><span th:text="${comercial.id}">1</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Nombre<br></span><span th:text="${comercial.nombre}">Nombre</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Apellido 1<br></span><span th:text="${comercial.apellido1}">Apellido</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Apellido 2<br></span><span th:text="${comercial.apellido2 ?: '-'}">-</span></div>
        <div class="col-6 col-lg-2"><span class="d-lg-none small text-secondary">Comisión<br></span><span th:text="${comercial.comision != null ? #numbers.formatDecimal(comercial.comision * 100, 1, 2) + '%' : '-'}">15.00%</span></div>
        <div class="col-12 col-lg-3 d-flex flex-wrap gap-1">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
            <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
