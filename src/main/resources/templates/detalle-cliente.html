<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f3f6f4; color: #23332d; } .page-title { color: #194b39; }</style>
</head>
<body>
<main class="container py-4 py-lg-5">
    <header class="row align-items-center g-3 pb-3 mb-3 border-bottom">
        <h1 class="page-title h2 col mb-0">Detalle de cliente</h1>
        <div class="col-auto d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a>
            <a class="btn btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
        </div>
    </header>
    <dl class="row g-0 bg-white rounded">
        <dt class="col-5 col-md-3 p-3 border-bottom">Id</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${cliente.id}">1</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Nombre</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${cliente.nombre}">Nombre</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Primer apellido</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${cliente.apellido1}">Apellido</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Segundo apellido</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${cliente.apellido2 ?: '-'}">-</dd>
        <dt class="col-5 col-md-3 p-3 border-bottom">Ciudad</dt><dd class="col-7 col-md-9 p-3 border-bottom mb-0" th:text="${cliente.ciudad ?: '-'}">-</dd>
        <dt class="col-5 col-md-3 p-3">Categoría</dt><dd class="col-7 col-md-9 p-3 mb-0" th:text="${cliente.categoria ?: '-'}">-</dd>
    </dl>

    <section class="mt-4">
        <h2 class="h4 page-title mb-3">Pedidos del cliente</h2>
        <div th:if="${#lists.isEmpty(pedidos)}" class="bg-white p-4 text-secondary">Este cliente no tiene pedidos.</div>
        <div th:unless="${#lists.isEmpty(pedidos)}" class="table-responsive bg-white rounded">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Total</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Comercial</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">0</td>
                        <td th:text="${#numbers.formatDecimal(pedido.total, 1, 2)}">0.00</td>
                        <td th:text="${pedido.fecha ?: '-'}">fecha</td>
                        <td>
                            <a th:if="${pedido.comercialId != null}"
                               th:href="@{/comerciales/{id}(id=${pedido.comercialId})}"
                               th:text="${pedido.comercialNombre ?: 'Sin comercial asignado'}">comercial</a>
                            <span th:unless="${pedido.comercialId != null}"
                                  th:text="${pedido.comercialNombre ?: 'Sin comercial asignado'}">comercial</span>
                        </td>
                        <td><a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Ver</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
